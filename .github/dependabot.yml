version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/ChangeQueryExport"
      - "/HtmlExportPlugin"
      - "/PPTXExportPlugin"
      - "/PluginBase"
      - "/SamplePlugin"
    schedule:
      interval: "weekly"
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
